name: Prepare experimental React candidates
on:
  workflow_dispatch:
    inputs:
      family:
        description: Package family
        type: choice
        options: [both, martlet, krigsvold]
        default: both
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      WORKBENCH_BROWSER: ${{ matrix.browser }}
      DESIGN_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Use the Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 10
      - run: npm run test:browser
      - run: npm run test:reference
      - run: npm run test:packages
      - run: npm run test:agents
  prepare:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/prepare-release.mjs "$RELEASE_FAMILY"
        env:
          RELEASE_FAMILY: ${{ inputs.family }}
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-react-candidates
          path: release-candidates/
          if-no-files-found: error
