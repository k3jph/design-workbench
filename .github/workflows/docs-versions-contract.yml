name: Versioned documentation contract
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/docs-versions/*.test.mjs
