name: Read-only Jekyll deployed visual evidence
on:
  pull_request:
    paths:
      - 'scripts/qa/jekyll-live-develop-capture.mjs'
      - 'scripts/qa/jekyll-pr-preview-capture.mjs'
      - '.github/workflows/jekyll-live-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for read-only browser inspection
        run: npx playwright install --with-deps chromium
      - name: Capture actual Cloudflare develop pages and verify deployed source SHAs
        run: node scripts/qa/jekyll-live-develop-capture.mjs
        env:
          LIVE_JEKYLL_EVIDENCE_DIR: ${{ runner.temp }}/jekyll-live-evidence
      - name: Independently capture Jekyll PR previews at their exact source SHA
        if: always()
        run: node scripts/qa/jekyll-pr-preview-capture.mjs
        env:
          LIVE_JEKYLL_EVIDENCE_DIR: ${{ runner.temp }}/jekyll-live-evidence
      - name: Archive all available evidence, including failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-live-develop-visual-evidence
          path: ${{ runner.temp }}/jekyll-live-evidence/
          if-no-files-found: warn
          retention-days: 14
