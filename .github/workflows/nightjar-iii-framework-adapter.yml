name: Verify framework adapter contract
on:
  pull_request:
    paths:
      - 'scripts/qa/portable-*.mjs'
      - 'scripts/qa/portable-matrix.json'
      - 'tests/portable-runner.test.mjs'
      - 'examples/page-archetypes/scripts/verify-html.py'
      - '.github/workflows/nightjar-iii-framework-adapter.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  adapter-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node --test tests/portable-runner.test.mjs scripts/qa/portable-extensibility.test.mjs scripts/qa/portable-interactions.test.mjs scripts/qa/portable-recipes.test.mjs
        env:
          NIGHTJAR_TEST_BROWSER: ${{ matrix.browser }}
