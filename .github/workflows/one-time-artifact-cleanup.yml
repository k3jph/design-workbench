          python3 - <<'PY'
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          ids = list(map(int, os.environ['APPROVED_IDS'].split()))
          assert len(ids) == len(set(ids)) == 1551
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
          }
          removed = 0
          missing = 0
          failed = []
          for index, artifact_id in enumerate(ids, 1):
              request = Request(
                  f'https://api.github.com/repos/k3jph/design-workbench/actions/artifacts/{artifact_id}',
                  headers=headers, method='DELETE',
              )
              for attempt in range(5):
                  try:
                      with urlopen(request, timeout=30) as response:
                          if response.status != 204:
                              raise RuntimeError(f'Unexpected status {response.status}')
                      removed += 1
                      break
                  except HTTPError as error:
                      if error.code == 404:
                          missing += 1
                          break
                      if error.code in (403, 429) and error.headers.get('X-RateLimit-Remaining') == '0':
                          wait = max(1, int(error.headers['X-RateLimit-Reset']) - time.time() + 3)
                          print(f'Rate limit reached after {index - 1} IDs. Waiting {wait:.0f} seconds.', flush=True)
                          time.sleep(wait)
                          continue
                      if error.code in (403, 429) and (error.headers.get('Retry-After') or b'secondary rate limit' in error.read().lower()):
                          time.sleep(int(error.headers.get('Retry-After', '60')))
                          continue
                      if error.code < 500:
                          raise
                      time.sleep(2 ** attempt)
                  except (URLError, TimeoutError):
                      time.sleep(2 ** attempt)
              else:
                  failed.append(artifact_id)
              if index % 100 == 0:
                  print(f'Checked {index}/{len(ids)}: {removed} removed, {missing} already absent.', flush=True)
              time.sleep(0.55)
          print(f'Removed {removed}; already absent {missing}; failed {len(failed)}.', flush=True)
          if failed:
              raise SystemExit(f'Failed artifact IDs: {failed}')
          PY
