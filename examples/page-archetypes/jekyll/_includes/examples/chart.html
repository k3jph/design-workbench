<figure class="dash-panel dash-chart dash-panel--{{ include.id }}" aria-labelledby="{{ include.id }}-title">
  <header><h2 id="{{ include.id }}-title">{{ include.title | escape }}</h2><p>{{ include.description | escape }}</p></header>
  <div class="dash-chart__plot" data-chart="{{ include.id }}"></div>
  <figcaption data-chart-summary="{{ include.id }}">The data table provides an alternative to the chart.</figcaption>
  <details><summary>View {{ include.title | downcase | escape }} data</summary><div class="example-table-scroll" role="region" aria-label="{{ include.title | escape }} data" tabindex="0"><table data-chart-table="{{ include.id }}"><caption>{{ include.title | escape }} — synthetic data</caption><thead><tr>{% if include.id == 'categories' %}<th scope="col">Category</th><th scope="col">Current sessions</th><th scope="col">Previous sessions</th>{% else %}<th scope="col">Label</th><th scope="col">{% case include.id %}{% when 'sessions' %}Sessions{% when 'downloads' %}Downloads{% when 'latency' %}Mean latency (ms){% endcase %}</th>{% endif %}</tr></thead><tbody>
  {% if include.id == 'latency' %}
    {% assign first_service = site.data.dashboards.services | first %}{% assign ordered = first_service.samples | sort: 'time' %}{% assign window_start = snapshot_seconds | minus: 18000 %}{% assign service_count = site.data.dashboards.services | size %}{% assign plotted = 0 %}
    {% for sample in ordered %}{% assign seconds = sample.time | date: '%s' | plus: 0 %}{% if seconds >= window_start and seconds <= snapshot_seconds %}{% assign sum = 0 %}{% assign present = 0 %}{% for service in site.data.dashboards.services %}{% assign matching = service.samples | where: 'time', sample.time %}{% if matching.size == 1 %}{% assign observation = matching | first %}{% assign sum = sum | plus: observation.latency_ms %}{% assign present = present | plus: 1 %}{% endif %}{% endfor %}{% if present == service_count and service_count > 0 %}{% assign denominator = service_count | times: 2 %}{% assign mean = sum | times: 2 | plus: service_count | divided_by: denominator %}{% assign plotted = plotted | plus: 1 %}<tr><th scope="row">{{ sample.time | slice: 11, 5 }} UTC</th><td>{{ mean }}</td></tr>{% endif %}{% endif %}{% endfor %}{% if plotted == 0 %}<tr><td colspan="2">No common observations are available for this chart.</td></tr>{% endif %}
  {% elsif metrics_unavailable %}<tr><td colspan="{% if include.id == 'categories' %}3{% else %}2{% endif %}">Chart values are unavailable until a safe range is selected.</td></tr>
  {% elsif include.id == 'categories' %}
    {% assign plotted = 0 %}{% for category in categories %}{% assign current_rows = initial | where: 'category', category %}{% unless current_rows == empty %}{% assign plotted = plotted | plus: 1 %}{% assign current_total = 0 %}{% for row in current_rows %}{% assign current_total = current_total | plus: row.sessions %}{% endfor %}<tr><th scope="row">{{ category | escape }}</th><td>{{ current_total }}</td><td>{% if missing_initial == 0 and missing_previous == 0 %}{% assign preceding_rows = previous | where: 'category', category %}{% assign preceding_total = 0 %}{% for row in preceding_rows %}{% assign preceding_total = preceding_total | plus: row.sessions %}{% endfor %}{{ preceding_total }}{% else %}Unavailable{% endif %}</td></tr>{% endunless %}{% endfor %}{% if plotted == 0 %}<tr><td colspan="3">No observations are available for this chart.</td></tr>{% endif %}
  {% else %}
    {% assign chart_dates = initial | map: 'date' | uniq | sort %}{% for date in chart_dates %}{% assign daily = initial | where: 'date', date %}{% assign day_total = 0 %}{% for row in daily %}{% if include.id == 'sessions' %}{% assign day_total = day_total | plus: row.sessions %}{% else %}{% assign day_total = day_total | plus: row.downloads %}{% endif %}{% endfor %}<tr><th scope="row">{{ date | escape }}</th><td>{{ day_total }}</td></tr>{% endfor %}{% if chart_dates == empty %}<tr><td colspan="2">No observations are available for this chart.</td></tr>{% endif %}
  {% endif %}
  </tbody></table></div></details>
</figure>
