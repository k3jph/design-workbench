title: Krigsvold Jekyll
family: krigsvold
description: A reference shell for publishing with Krigsvold, rendered by Jekyll.
url: ""
baseurl: ""
markdown: kramdown
highlighter: rouge
permalink: /journal/:title/
exclude: [Gemfile, Gemfile.lock, README.md, scripts, dist, vendor, node_modules, package.json, docs, template.zip]
defaults:
  - scope: {path: "", type: posts}
    values: {layout: post}
