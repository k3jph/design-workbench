<header class="site-header mast"><div class="container header-inner"><a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/mark.svg' | relative_url }}" alt="" width="42" height="42"><span>{{ site.title | escape }}</span></a><button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button><nav id="site-nav" aria-label="Primary navigation"><ul>{% for item in site.data.navigation %}<li class="nav-item"><a class="nav-link" href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title | escape }}</a></li>{% endfor %}<li><button type="button" class="appearance-toggle" data-appearance-toggle aria-pressed="false">Dark mode</button></li></ul></nav></div></header>
